name: Build mod jar

on:
  push:
    branches: [main]
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: storage-item-esp-jar
          path: build/libs/storage-item-esp-1.1.0.jar

      - name: Commit jar to dist/
        run: |
          rm -rf dist
          mkdir -p dist
          cp build/libs/storage-item-esp-1.1.0.jar dist/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A dist
          git commit -m "Add built jar [skip ci]" || echo "nothing to commit"
          git push
